<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090c" />
    <meta name="description" content="EarthTrip: globo interattivo di Terra e Luna con satelliti in tempo reale, mappa della superficie e il gioco Difendi la Terra." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:title" content="EarthTrip" />

    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./style.css?v=24" />
    <link rel="manifest" href="./manifest.json" />
  </head>
  <body>
    <div id="app"></div>
    <script src="./app-v24.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        // Dopo un rilascio il nuovo service worker prende il controllo: si ricarica una volta per usare i file nuovi.
        var hadController = Boolean(navigator.serviceWorker.controller);
        var reloaded = false;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (!hadController || reloaded) return;
          reloaded = true;
          location.reload();
        });
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      }
    </script>
  </body>
</html>
