    <div id="app"></div>

    <script>
      // v25: il service worker si registra e basta. Il nuovo SW resta in attesa e prende il controllo al prossimo avvio:
      // niente reload automatico (prima, con un SW già installato, la pagina si ricaricava dopo pochi secondi).
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      }
    </script>
