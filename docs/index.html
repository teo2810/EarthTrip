<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>EarthTrip — Earth Defense</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#000510" />
  <link rel="icon" href="./favicon.svg" />
</head>
<body>
  <div id="hud">
    <div class="top-bar">
      <span id="time-display">UTC —</span>
      <button id="game-toggle">🎮 Difendi la Terra</button>
      <button id="mute-btn">🔊</button>
    </div>

    <div id="game-hud" class="hidden">
      <div class="stat">Ondata <span id="wave">1</span></div>
      <div class="stat">HP Terra <span id="earth-hp">100</span></div>
      <div class="stat">EXP <span id="exp">0</span></div>
      <div class="stat">Record <span id="highscore">0</span></div>
      <div class="lunar-bar">
        <div id="lunar-fill"></div>
        <span>🌕 Superarma</span>
      </div>
      <button id="lunar-pulse" class="hidden">🌕 ATTIVA IMPULSO LUNARE</button>
      <div id="upgrade-shop" class="hidden">
        <h4>Potenziamenti</h4>
        <button data-upgrade="cannon">+ Cannone (150 EXP)</button>
        <button data-upgrade="rate">Vel. Ricarica (100 EXP)</button>
        <button data-upgrade="damage">Danno (120 EXP)</button>
        <button data-upgrade="weapon-mg">Mitragliatrice (200)</button>
        <button data-upgrade="weapon-multi">Multi-Cannone (250)</button>
        <button data-upgrade="weapon-homing">Missili Ricerca (300)</button>
      </div>
    </div>
  </div>

  <canvas id="webgl"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.169.0",
      "three/addons/": "https://esm.sh/three@0.169.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
